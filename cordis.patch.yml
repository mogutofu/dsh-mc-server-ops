# dsh-mc-server-ops bundle patch
#
# 安装本包后，dsh 启动时会自动插入 mc-server-ops 插件行。
# 所有配置都可以在「设置 → 插件」里改，这里的值只是初始默认。
- insert:
    - id: mc-server-ops
      name: dsh-mc-server-ops
      config:
        server:
          dir: ''
          rconPort: 25575
          rconPassword: ''
        persona:
          enabled: true
          name: 小铜
          text: ''
          scope: qq
